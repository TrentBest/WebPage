name: .NET Tests

on:
  push:
    branches:
      - development
      - "mvp/**"
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore SingularityHub.Tests/SingularityHub.Tests.csproj
          dotnet restore Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj
          dotnet restore Experiences/PongExperience.Tests/PongExperience.Tests.csproj

      - name: Build
        run: |
          dotnet build SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-restore

      - name: Diagnose SingularityHub assembly before and after experience builds
        timeout-minutes: 6
        run: |
          set +e
          echo "=== TheSingularityWorkshop runtime artifact ==="
          sha256sum TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll
          stat -c 'size=%s mtime=%y path=%n' TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll
          strings TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll | grep -E 'POOL:|PopulationPoolSize|PopulationThreshold' || true

          mkdir -p /tmp/assembly-inspector
          cat > /tmp/assembly-inspector/AssemblyInspector.csproj <<'EOF'
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
              <TargetFramework>net8.0</TargetFramework>
              <ImplicitUsings>enable</ImplicitUsings>
              <Nullable>enable</Nullable>
            </PropertyGroup>
          </Project>
          EOF
          cat > /tmp/assembly-inspector/Program.cs <<'EOF'
          using System.Reflection;
          using System.Runtime.Loader;

          var testOutput = Path.GetFullPath("SingularityHub.Tests/bin/Release/net8.0");
          Console.WriteLine($"TEST_OUTPUT={testOutput}");
          foreach (var candidate in Directory.EnumerateFiles(testOutput, "*.dll"))
          {
              try
              {
                  var candidateAssembly = AssemblyLoadContext.Default.LoadFromAssemblyPath(candidate);
                  var candidateType = candidateAssembly.GetType("TheSingularityWorkshop.Services.PageStateContext");
                  if (candidateType is not null)
                  {
                      Console.WriteLine($"PAGE_STATE_CONTEXT_ASSEMBLY={candidateAssembly.FullName}");
                      Console.WriteLine($"PAGE_STATE_CONTEXT_ASSEMBLY_LOCATION={candidateAssembly.Location}");
                      Console.WriteLine($"PAGE_STATE_CONTEXT_ASSEMBLY_MVID={candidateAssembly.ManifestModule.ModuleVersionId}");
                  }
              }
              catch (Exception ex)
              {
                  Console.WriteLine($"ASSEMBLY_INSPECT_ERROR={Path.GetFileName(candidate)}:{ex.GetType().Name}:{ex.Message}");
              }
          }

          var path = Path.GetFullPath("TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll");
          var assembly = AssemblyLoadContext.Default.LoadFromAssemblyPath(path);
          Console.WriteLine($"DIRECT_WORKSHOP_ASSEMBLY={assembly.FullName}");
          Console.WriteLine($"DIRECT_WORKSHOP_TYPE_COUNT={assembly.GetTypes().Length}");
          var type = assembly.GetType("TheSingularityWorkshop.Services.PageStateContext");
          if (type is null)
          {
              Console.WriteLine("DIRECT_WORKSHOP_PAGE_STATE_CONTEXT=NOT_FOUND");
              return;
          }
          var ctor = type.GetConstructor(new[] { typeof(object) })
              ?? throw new InvalidOperationException("PageStateContext(object) constructor was not found.");
          var body = ctor.GetMethodBody()
              ?? throw new InvalidOperationException("Constructor has no method body.");

          Console.WriteLine($"LOADED_ASSEMBLY={assembly.FullName}");
          Console.WriteLine($"LOADED_ASSEMBLY_LOCATION={assembly.Location}");
          Console.WriteLine($"LOADED_ASSEMBLY_MVID={assembly.ManifestModule.ModuleVersionId}");
          Console.WriteLine($"CONSTRUCTOR_DECLARING_TYPE={ctor.DeclaringType?.AssemblyQualifiedName}");
          Console.WriteLine($"CONSTRUCTOR_MAX_STACK={body.MaxStackSize}");
          Console.WriteLine($"CONSTRUCTOR_LOCAL_COUNT={body.LocalVariables.Count}");
          foreach (var local in body.LocalVariables)
              Console.WriteLine($"CONSTRUCTOR_LOCAL={local.LocalIndex}:{local.LocalType.FullName}");
          Console.WriteLine($"CONSTRUCTOR_IL_LENGTH={body.GetILAsByteArray()?.Length ?? 0}");
          Console.WriteLine($"CONSTRUCTOR_IL={Convert.ToHexString(body.GetILAsByteArray() ?? Array.Empty<byte>())}");
          EOF
          dotnet restore /tmp/assembly-inspector/AssemblyInspector.csproj && dotnet run --project /tmp/assembly-inspector/AssemblyInspector.csproj --configuration Release --no-restore
          echo "=== End runtime artifact inspection ==="
          echo "=== Forced TheSingularityWorkshop rebuild ==="
          dotnet build TheSingularityWorkshop/TheSingularityWorkshop.csproj --configuration Release --no-restore -t:Rebuild
          sha256sum TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll
          strings TheSingularityWorkshop/bin/Release/net8.0/TheSingularityWorkshop.dll | grep -E 'POOL:|PopulationPoolSize|PopulationThreshold' || true
          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LivingGuiRuntimeTests" --logger "console;verbosity=normal"
          forced_status=$?
          echo "SINGULARITYHUB_LIVING_GUI_STATUS_AFTER_FORCED_REBUILD=$forced_status"
          echo "=== End forced rebuild diagnostic ==="

          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LivingGuiRuntimeTests" --logger "console;verbosity=normal"
          first_status=$?
          echo "SINGULARITYHUB_LIVING_GUI_STATUS_IMMEDIATELY_AFTER_BUILD=$first_status"

          dotnet build Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-restore

          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --filter "FullyQualifiedName~LivingGuiRuntimeTests" --logger "console;verbosity=normal"
          second_status=$?
          echo "SINGULARITYHUB_LIVING_GUI_STATUS_AFTER_ALL_EXPERIENCE_BUILDS=$second_status"

          if [ "$first_status" -ne "$second_status" ]; then
            echo "BUILD_ORDER_CHANGED_TEST_RESULT=true"
          else
            echo "BUILD_ORDER_CHANGED_TEST_RESULT=false"
          fi

          exit 1

      - name: Test SingularityHub with TRX, coverage, and hang diagnostics
        timeout-minutes: 6
        run: |
          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini --collect:"XPlat Code Coverage" --results-directory ./TestResults/SingularityHub --logger "trx;LogFileName=SingularityHub.Tests.trx"

      - name: Test LivingGui Experience with TRX and coverage
        timeout-minutes: 5
        run: |
          dotnet test Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/LivingGui --logger "trx;LogFileName=LivingGuiExperience.Tests.trx"

      - name: Test Pong Experience with TRX and coverage
        timeout-minutes: 5
        run: |
          dotnet test Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/Pong --logger "trx;LogFileName=PongExperience.Tests.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: ${{ success() && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false
