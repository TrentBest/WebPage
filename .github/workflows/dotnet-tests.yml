name: .NET Tests

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Checkout MicroBundleDomain dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: architecture/runtime-contract-ownership
          path: _dependencies/MicroBundleDomain

      - name: Checkout FSM_COS dependency
        uses: actions/checkout@v4
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: architecture/domain-owned-microbundle-contract
          path: _dependencies/FSM_COS

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Pack local composition dependencies
        run: |
          dotnet restore _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx
          dotnet build _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.slnx --configuration Release --no-restore
          mkdir -p _dependencies/nuget
          dotnet pack _dependencies/MicroBundleDomain/TheSingularityWorkshop.MicroBundleDomain.csproj --configuration Release --no-build --output _dependencies/nuget
          dotnet nuget add source "$GITHUB_WORKSPACE/_dependencies/nuget" --name CompositionDependenciesLocal
          dotnet restore _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln
          dotnet build _dependencies/FSM_COS/TheSingularityWorkshop.FSM_COS.sln --configuration Release --no-restore
          dotnet pack _dependencies/FSM_COS/src/FSM_COS/FSM_COS.csproj --configuration Release --no-build --output _dependencies/nuget

      - name: Restore
        run: |
          dotnet restore SingularityHub.Tests/SingularityHub.Tests.csproj
          dotnet restore Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj
          dotnet restore Experiences/PongExperience.Tests/PongExperience.Tests.csproj

      - name: Build
        run: |
          dotnet build SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-restore

      - name: Test with TRX and coverage
        run: |
          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/SingularityHub --logger "trx;LogFileName=SingularityHub.Tests.trx"
          dotnet test Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/LivingGui --logger "trx;LogFileName=LivingGuiExperience.Tests.trx"
          dotnet test Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/Pong --logger "trx;LogFileName=PongExperience.Tests.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14
          if-no-files-found: error

      - name: Upload coverage to Codecov
        if: always() && secrets.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: true
