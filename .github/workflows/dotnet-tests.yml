name: .NET Tests

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      # Keep browser automation isolated from the application's .NET dependency graph.
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Playwright Chromium
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium

      # Verify the released FSM_COS package that downstream hosts actually restore.
      # NuGet.Config restricts package sources to nuget.org; no local source build or
      # locally packed replacement may mask a public-package compatibility problem.

      - name: Cache NuGet packages
        uses: actions/cache@v5
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: |
          dotnet restore SingularityHub.Tests/SingularityHub.Tests.csproj
          dotnet restore Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj
          dotnet restore Experiences/PongExperience.Tests/PongExperience.Tests.csproj

      # Compile the browser host against the pinned public FSM_COS package.
      # This catches package integration failures that isolated experience tests cannot see.
      - name: Restore and build WebPage browser host
        run: |
          dotnet restore TheSingularityWorkshop/TheSingularityWorkshop.csproj
          dotnet build TheSingularityWorkshop/TheSingularityWorkshop.csproj --configuration Release --no-restore

      # A lightweight HTTP smoke test proves the built host serves its landing page and
      # Blazor WebAssembly boot manifest. It does not claim to verify browser animations.
      - name: Smoke-test WebPage host and browser journey
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project TheSingularityWorkshop/TheSingularityWorkshop.csproj --configuration Release --no-build --no-launch-profile --urls http://127.0.0.1:5260 > /tmp/webpage-host.log 2>&1 &
          host_pid=$!
          cleanup() {
            kill "$host_pid" 2>/dev/null || true
            wait "$host_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          ready=false
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5260/ -o /tmp/webpage-index.html; then
              ready=true
              break
            fi
            if ! kill -0 "$host_pid" 2>/dev/null; then
              cat /tmp/webpage-host.log
              exit 1
            fi
            sleep 2
          done

          if [ "$ready" != true ]; then
            cat /tmp/webpage-host.log
            echo "WebPage host did not become ready within 60 seconds."
            exit 1
          fi

          grep -q '<title>The Singularity Workshop</title>' /tmp/webpage-index.html
          curl --fail --silent http://127.0.0.1:5260/_framework/blazor.boot.json -o /tmp/webpage-blazor.boot.json
          grep -q '"resources"' /tmp/webpage-blazor.boot.json
          echo "WebPage host served its landing HTML and Blazor boot manifest."

          mkdir -p TestResults/Browser
          WORKSHOP_BASE_URL=http://127.0.0.1:5260 WORKSHOP_SCREENSHOT_DIR=TestResults/Browser node tests/browser-smoke.mjs

      - name: Build
        run: |
          dotnet build SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-restore
          dotnet build Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-restore

      - name: Test SingularityHub with TRX, coverage, and hang diagnostics
        timeout-minutes: 6
        run: |
          dotnet test SingularityHub.Tests/SingularityHub.Tests.csproj --configuration Release --no-build --blame-hang --blame-hang-timeout 2m --blame-hang-dump-type mini --collect:"XPlat Code Coverage" --results-directory ./TestResults/SingularityHub --logger "trx;LogFileName=SingularityHub.Tests.trx"

      - name: Test LivingGui Experience with TRX and coverage
        timeout-minutes: 5
        run: |
          dotnet test Experiences/LivingGuiExperience.Tests/LivingGuiExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/LivingGui --logger "trx;LogFileName=LivingGuiExperience.Tests.trx"

      - name: Test Pong Experience with TRX and coverage
        timeout-minutes: 5
        run: |
          dotnet test Experiences/PongExperience.Tests/PongExperience.Tests.csproj --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./TestResults/Pong --logger "trx;LogFileName=PongExperience.Tests.trx"

      - name: Upload test results and coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-and-coverage
          path: TestResults/
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload coverage to Codecov
        if: ${{ success() && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ env.CODECOV_TOKEN }}
          files: ./TestResults/**/coverage.cobertura.xml
          fail_ci_if_error: false

  source-integration:
    name: Workshop repository-source integration
    runs-on: ubuntu-24.04
    steps:
      # Use sibling checkouts so project-relative paths match a local Workshop workspace.
      - name: Checkout WebPage pull-request head
        uses: actions/checkout@v5
        with:
          path: WebPage
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Checkout FSM_API development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/FSM_API
          ref: development
          path: FSM_API
      - name: Checkout MicroBundleDomain development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.MicroBundleDomain
          ref: development
          path: TheSingularityWorkshop.MicroBundleDomain
      - name: Checkout FSM_COS development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.FSM_COS
          ref: development
          path: TheSingularityWorkshop.FSM_COS
      - name: Checkout FSM_UserIO development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/FSM_UserIO
          ref: development
          path: FSM_UserIO
      - name: Checkout GUI development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.GUI
          ref: development
          path: TheSingularityWorkshop.GUI
      - name: Checkout Renderer development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.Renderer
          ref: development
          path: TheSingularityWorkshop.Renderer
      - name: Checkout Visualize development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.Visualize
          ref: development
          path: TheSingularityWorkshop.Visualize
      - name: Checkout ProtocolAi development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.ProtocolAi
          ref: development
          path: TheSingularityWorkshop.ProtocolAi
      - name: Checkout GrammarAi development
        uses: actions/checkout@v5
        with:
          repository: TrentBest/TheSingularityWorkshop.GrammarAi
          ref: development
          path: TheSingularityWorkshop.GrammarAi
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      # Generate the asset shown by the Digitens page from the checked-out Visualize C# proof.
      # This keeps the source-integration build honest: the page consumes output from the real
      # Visualizer -> GUI.SVG path rather than merely compiling against the Visualize assembly.
      - name: Generate Digitens Visualize proof from source
        working-directory: WebPage
        run: |
          set -euo pipefail
          asset="$GITHUB_WORKSPACE/WebPage/TheSingularityWorkshop/wwwroot/Visualize/07-gui-svg-connected-points.svg"
          dotnet run --project ../TheSingularityWorkshop.Visualize/integrations/GuiSvg/Proof/GuiSvgProof.csproj --configuration Release -- "$asset"
          test -s "$asset"
          grep -q 'Visualizer frame manifested through GUI.SVG' "$asset"
          grep -q 'route-dash-animation' "$asset"
          grep -q '<animate' "$asset"
          grep -q 'vertex-a-pulse' "$asset"
          draw_count="$(grep -o 'id="draw-' "$asset" | wc -l)"
          test "$draw_count" -ge 16
          echo "Digitens page asset generated by Visualizer/GUI.SVG ($draw_count draw nodes)."
      - name: Restore WebPage from checked-out Workshop source
        working-directory: WebPage
        run: dotnet restore TheSingularityWorkshop/TheSingularityWorkshop.csproj -p:WorkshopUseRepositorySources=true
      - name: Build WebPage from checked-out Workshop source
        working-directory: WebPage
        run: dotnet build TheSingularityWorkshop/TheSingularityWorkshop.csproj --configuration Release --no-restore -p:WorkshopUseRepositorySources=true
