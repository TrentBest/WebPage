<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Singularity Workshop — living electrical avatar</title>
  <desc id="desc">The original Workshop eye remains at the center while energy pulses travel through branching circuit paths, illuminate the orbital rings, and cycle from gold through magenta, blue, and cyan.</desc>

  <style>
    @media (prefers-reduced-motion: reduce) {
      animate, animateTransform, animateMotion { display: none; }
      .circuit-pulse, .orbit-energy, .eye-energy, .particle { opacity: .72; }
    }
  </style>

  <defs>
    <clipPath id="avatar-clip"><circle cx="256" cy="256" r="244"/></clipPath>
    <radialGradient id="core-aura">
      <stop offset="0" stop-color="#fff9d6" stop-opacity=".7"/>
      <stop offset=".24" stop-color="#ffd34d" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#ff2cff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#00a8ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd34d">
        <animate attributeName="stop-color" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset=".52" stop-color="#ff2cff">
        <animate attributeName="stop-color" values="#ff2cff;#168cff;#00eaff;#ffd34d;#ff2cff" dur="12s" repeatCount="indefinite"/>
      </stop>
      <stop offset="1" stop-color="#00eaff">
        <animate attributeName="stop-color" values="#00eaff;#ffd34d;#ff2cff;#168cff;#00eaff" dur="12s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="gold-left" x1="0" y1="0" x2="1" y2=".4">
      <stop offset="0" stop-color="#ffd34d" stop-opacity=".95"/>
      <stop offset="1" stop-color="#ffd34d" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft-glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="hot-glow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Circuit routes are deliberately separate from the source artwork:
         the raster remains the identity layer; these are the animated energy layer. -->
    <path id="route-left-top" d="M18 126 H74 V154 H112 L143 185 H178 L205 212"/>
    <path id="route-left-mid" d="M10 248 H58 V226 H96 L126 196 H166 L202 220"/>
    <path id="route-left-low" d="M30 386 H78 V354 H116 L148 322 H184 L211 292"/>
    <path id="route-top" d="M214 12 V54 H238 V86 L256 104 V151"/>
    <path id="route-right-top" d="M494 112 H438 V146 H404 L374 176 H340 L310 207"/>
    <path id="route-right-mid" d="M502 260 H452 V232 H416 L384 202 H348 L312 224"/>
    <path id="route-right-low" d="M482 398 H432 V366 H396 L364 334 H328 L306 294"/>
    <path id="route-bottom" d="M286 500 V452 H268 V420 L256 398 V356"/>

    <g id="circuit-nodes" fill="#dffcff">
      <circle cx="74" cy="126" r="3"/><circle cx="112" cy="154" r="2.5"/>
      <circle cx="58" cy="248" r="3"/><circle cx="126" cy="196" r="2.5"/>
      <circle cx="78" cy="386" r="3"/><circle cx="148" cy="322" r="2.5"/>
      <circle cx="238" cy="54" r="2.5"/><circle cx="438" cy="112" r="3"/>
      <circle cx="404" cy="146" r="2.5"/><circle cx="452" cy="260" r="3"/>
      <circle cx="416" cy="202" r="2.5"/><circle cx="432" cy="398" r="3"/>
      <circle cx="364" cy="334" r="2.5"/><circle cx="268" cy="452" r="2.5"/>
    </g>
  </defs>

  <g clip-path="url(#avatar-clip)">
    <image href="TheSingularityWorkshopLogo.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>

    <!-- The original left-side gold illumination is the primary power source. -->
    <ellipse cx="96" cy="252" rx="116" ry="190" fill="url(#gold-left)" opacity=".24" filter="url(#hot-glow)">
      <animate attributeName="opacity" values=".18;.52;.28;.62;.18" dur="6.5s" repeatCount="indefinite"/>
    </ellipse>
    <circle cx="256" cy="256" r="174" fill="url(#core-aura)" opacity=".34">
      <animate attributeName="r" values="150;184;158;176;150" dur="5.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".22;.52;.3;.58;.22" dur="5.2s" repeatCount="indefinite"/>
    </circle>

    <!-- Dim circuit traces establish the physical routes before pulses travel them. -->
    <g fill="none" stroke="#8ddfff" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round" opacity=".42">
      <use href="#route-left-top"/><use href="#route-left-mid"/><use href="#route-left-low"/>
      <use href="#route-top"/><use href="#route-right-top"/><use href="#route-right-mid"/>
      <use href="#route-right-low"/><use href="#route-bottom"/>
    </g>
    <g fill="none" stroke="#ffd34d" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" opacity=".7">
      <use href="#route-left-top"/><use href="#route-left-mid"/><use href="#route-left-low"/>
    </g>

    <!-- Traveling packets run along the actual circuit paths and converge on the eye. -->
    <g class="circuit-pulse" fill="none" stroke="url(#spectrum)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft-glow)">
      <use href="#route-left-top" stroke-dasharray="2 190" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="0;-330;0" dur="4.8s" repeatCount="indefinite"/></use>
      <use href="#route-left-mid" stroke-dasharray="2 170" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="0;-330;0" dur="3.9s" begin="-1.3s" repeatCount="indefinite"/></use>
      <use href="#route-left-low" stroke-dasharray="2 180" stroke-dashoffset="0"><animate attributeName="stroke-dashoffset" values="0;-330;0" dur="5.4s" begin="-2.1s" repeatCount="indefinite"/></use>
      <use href="#route-top" stroke-dasharray="2 140"><animate attributeName="stroke-dashoffset" values="0;-250;0" dur="4.4s" begin="-2s" repeatCount="indefinite"/></use>
      <use href="#route-right-top" stroke-dasharray="2 170"><animate attributeName="stroke-dashoffset" values="0;-320;0" dur="5.1s" begin="-1s" repeatCount="indefinite"/></use>
      <use href="#route-right-mid" stroke-dasharray="2 160"><animate attributeName="stroke-dashoffset" values="0;-320;0" dur="4.2s" begin="-2.8s" repeatCount="indefinite"/></use>
      <use href="#route-right-low" stroke-dasharray="2 170"><animate attributeName="stroke-dashoffset" values="0;-320;0" dur="5.7s" begin="-3s" repeatCount="indefinite"/></use>
      <use href="#route-bottom" stroke-dasharray="2 120"><animate attributeName="stroke-dashoffset" values="0;-220;0" dur="4.6s" begin="-1.7s" repeatCount="indefinite"/></use>
    </g>

    <use href="#circuit-nodes" filter="url(#soft-glow)" opacity=".7">
      <animate attributeName="opacity" values=".35;1;.45;.9;.35" dur="3.6s" repeatCount="indefinite"/>
    </use>

    <!-- Orbit rings receive the incoming pulses; counter-rotating layers create depth. -->
    <g transform="translate(256 256)" fill="none" filter="url(#soft-glow)">
      <ellipse class="orbit-energy" rx="132" ry="84" stroke="url(#spectrum)" stroke-width="2.2" stroke-dasharray="24 8 3 12" opacity=".88">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse class="orbit-energy" rx="112" ry="68" stroke="#ffd34d" stroke-width="1.4" stroke-dasharray="2 9 18 6" opacity=".72">
        <animateTransform attributeName="transform" type="rotate" from="42" to="-318" dur="13s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="91" ry="54" stroke="#c9faff" stroke-width="1" stroke-dasharray="1 5 5 12" opacity=".72">
        <animateTransform attributeName="transform" type="rotate" from="-25" to="335" dur="10s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M-142 0 C-94 -22 -62 -48 -20 -16 S54 42 142 0" stroke="url(#spectrum)" stroke-width="1.8" stroke-dasharray="3 8 16 5">
        <animate attributeName="stroke-dashoffset" values="0;-96" dur="2.2s" repeatCount="indefinite"/>
      </path>
      <path d="M-136 16 C-76 40 -48 5 0 -13 S86 -38 136 16" stroke="#ffd34d" stroke-width="1.25" stroke-dasharray="2 7 5 12" opacity=".8">
        <animate attributeName="stroke-dashoffset" values="-80;0" dur="2.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Energy reaches the eye: breathing aperture, concentric signal rings, and live iris. -->
    <g id="watching-eye" transform="translate(256 256)" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#hot-glow)">
      <circle class="eye-energy" r="61" fill="url(#core-aura)" stroke="#ffd34d" stroke-width="1.2" opacity=".65">
        <animate attributeName="r" values="52;66;56;62;52" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/>
      </circle>
      <path d="M-70 0 Q0 -45 70 0 Q0 45 -70 0Z" stroke="#eaffff" stroke-width="2.4" opacity=".9"/>
      <circle r="30" stroke="url(#spectrum)" stroke-width="1.8" stroke-dasharray="2 5 13 4">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </circle>
      <circle r="21" stroke="#ff2cff" stroke-width="1.5" stroke-dasharray="1 4 7 3" opacity=".9">
        <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ff2cff;#168cff;#00eaff;#ffd34d;#ff2cff" dur="12s" repeatCount="indefinite"/>
      </circle>
      <ellipse rx="7" ry="17" fill="#f4ffff" stroke="#00eaff" stroke-width="1.5">
        <animate attributeName="ry" values="17;9;17" dur="4.4s" repeatCount="indefinite"/>
        <animate attributeName="rx" values="7;5;7" dur="4.4s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M-48 -1 Q0 -29 48 -1" stroke="#ffd34d" stroke-width="1.2" stroke-dasharray="2 6">
        <animate attributeName="stroke-dashoffset" values="0;-54" dur="1.7s" repeatCount="indefinite"/>
        <animate attributeName="stroke" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <!-- Discrete particles follow the same incoming routes, then scatter around the core. -->
    <g class="particle" filter="url(#hot-glow)">
      <circle r="3.2" fill="#ffd34d"><animateMotion dur="4.8s" repeatCount="indefinite"><mpath href="#route-left-top"/></animateMotion><animate attributeName="fill" values="#ffd34d;#ff2cff;#168cff;#00eaff;#ffd34d" dur="12s" repeatCount="indefinite"/></circle>
      <circle r="2.5" fill="#ff2cff"><animateMotion dur="5.4s" begin="-1.8s" repeatCount="indefinite"><mpath href="#route-left-low"/></animateMotion></circle>
      <circle r="2.8" fill="#168cff"><animateMotion dur="5.1s" begin="-2.2s" repeatCount="indefinite"><mpath href="#route-right-top"/></animateMotion></circle>
      <circle r="2.4" fill="#00eaff"><animateMotion dur="4.2s" begin="-1.1s" repeatCount="indefinite"><mpath href="#route-right-mid"/></animateMotion></circle>
    </g>
  </g>

  <circle cx="256" cy="256" r="244" fill="none" stroke="url(#spectrum)" stroke-width="2.4" opacity=".8" filter="url(#soft-glow)">
    <animate attributeName="stroke-opacity" values=".28;1;.42;.9;.28" dur="4.6s" repeatCount="indefinite"/>
  </circle>
</svg>