<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">The Singularity Workshop — living avatar</title>
  <desc id="desc">The Workshop logo surrounded by a restrained digital vortex. Cyan and violet data sparks orbit and converge on the eye at the center.</desc>
  <defs>
    <radialGradient id="vortex" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#f5ffff" stop-opacity=".95"/>
      <stop offset=".18" stop-color="#00f0ff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#7a3cff" stop-opacity=".22"/>
      <stop offset="1" stop-color="#00eaff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset=".48" stop-color="#f5ffff"/>
      <stop offset="1" stop-color="#b14cff"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="avatarClip"><circle cx="256" cy="256" r="244"/></clipPath>
    <g id="data-ticks" fill="#bdfaff">
      <rect x="-2" y="-92" width="4" height="12" rx="1"/>
      <rect x="26" y="-113" width="3" height="7" rx="1"/>
      <rect x="-41" y="-128" width="3" height="10" rx="1"/>
      <rect x="71" y="-71" width="4" height="6" rx="1"/>
      <rect x="-84" y="-54" width="3" height="8" rx="1"/>
    </g>
  </defs>
  <g clip-path="url(#avatarClip)">
    <image href="https://raw.githubusercontent.com/TrentBest/WebPage/master/TheSingularityWorkshop/wwwroot/Images/TheSingularityWorkshopLogo.png" x="0" y="0" width="512" height="512" preserveAspectRatio="xMidYMid meet"/>
    <circle cx="256" cy="256" r="176" fill="url(#vortex)" opacity=".5">
      <animate attributeName="r" values="160;190;160" dur="4.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values=".25;.6;.25" dur="3.1s" repeatCount="indefinite"/>
    </circle>
    <g transform="translate(256 256)" fill="none" stroke="url(#energy)" filter="url(#glow)">
      <ellipse rx="116" ry="74" stroke-width="1.4" stroke-dasharray="3 9 17 5" opacity=".85">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="13s" repeatCount="indefinite"/>
      </ellipse>
      <ellipse rx="94" ry="56" stroke-width="1.1" stroke-dasharray="1 5 8 3" opacity=".8" transform="rotate(42)">
        <animateTransform attributeName="transform" type="rotate" from="42" to="-318" dur="9s" repeatCount="indefinite"/>
      </ellipse>
      <path d="M-132 0 C-88 -18 -58 -44 -20 -15 S48 37 132 0" stroke-width="1.8" stroke-dasharray="2 7 13 4" opacity=".9">
        <animate attributeName="stroke-dashoffset" values="0;-80" dur="2.4s" repeatCount="indefinite"/>
      </path>
      <path d="M-126 12 C-70 34 -47 2 0 -12 S80 -34 126 12" stroke-width="1.2" stroke-dasharray="1 6 4 10" opacity=".7">
        <animate attributeName="stroke-dashoffset" values="-65;0" dur="1.7s" repeatCount="indefinite"/>
      </path>
    </g>
    <g transform="translate(256 256)" filter="url(#glow)">
      <circle r="54" fill="url(#vortex)" opacity=".5">
        <animate attributeName="r" values="42;60;42" dur="2.6s" repeatCount="indefinite"/>
      </circle>
      <g fill="#e7ffff">
        <rect x="-38" y="-13" width="5" height="5"><animate attributeName="opacity" values=".15;1;.2" dur=".8s" repeatCount="indefinite"/></rect>
        <rect x="-26" y="17" width="4" height="4"><animate attributeName="opacity" values="1;.2;1" dur="1.1s" repeatCount="indefinite"/></rect>
        <rect x="-12" y="-29" width="3" height="3"><animate attributeName="opacity" values=".1;1;.1" dur=".65s" repeatCount="indefinite"/></rect>
        <rect x="8" y="-18" width="4" height="4"><animate attributeName="opacity" values=".2;1;.2" dur=".9s" repeatCount="indefinite"/></rect>
        <rect x="24" y="8" width="5" height="5"><animate attributeName="opacity" values="1;.15;1" dur=".72s" repeatCount="indefinite"/></rect>
        <rect x="10" y="29" width="3" height="3"><animate attributeName="opacity" values=".2;1;.2" dur="1.3s" repeatCount="indefinite"/></rect>
        <rect x="40" y="-5" width="2" height="2"><animate attributeName="opacity" values="1;.1;1" dur=".55s" repeatCount="indefinite"/></rect>
        <rect x="-44" y="9" width="2" height="2"><animate attributeName="opacity" values=".1;1;.1" dur=".7s" repeatCount="indefinite"/></rect>
      </g>
    </g>
    <g transform="translate(256 256)" opacity=".72">
      <use href="#data-ticks">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="19s" repeatCount="indefinite"/>
      </use>
      <use href="#data-ticks" transform="rotate(180)" opacity=".45">
        <animateTransform attributeName="transform" type="rotate" from="180" to="-180" dur="15s" repeatCount="indefinite"/>
      </use>
    </g>
  </g>
  <circle cx="256" cy="256" r="244" fill="none" stroke="#00eaff" stroke-opacity=".7" stroke-width="2">
    <animate attributeName="stroke-opacity" values=".25;.95;.25" dur="3.8s" repeatCount="indefinite"/>
  </circle>
</svg>
