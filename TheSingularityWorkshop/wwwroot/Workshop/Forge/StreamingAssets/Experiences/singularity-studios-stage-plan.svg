  <text x="950" y="35" text-anchor="end" fill="#819ba9" font-family="monospace" font-size="12">1000 m × 600 m · PLANNING TARGET</text>
  <rect x="50" y="80" width="900" height="540" fill="#07121e" stroke="#bfdbff" stroke-width="3"/>
  <rect x="77" y="80" width="846" height="504" fill="none" stroke="#9d57d7" stroke-width="3" stroke-dasharray="10 8"/>
  <rect x="140" y="152" width="720" height="396" fill="none" stroke="#00eaff" stroke-width="3"/>
  <rect x="50" y="80" width="900" height="36" fill="none" stroke="#ffcf86" stroke-width="3"/>
