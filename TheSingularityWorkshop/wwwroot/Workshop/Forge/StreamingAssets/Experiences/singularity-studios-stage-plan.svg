<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" role="img" aria-labelledby="title desc" data-render-status="static-fallback">
  <title id="title">Singularity Studios production plan — static fallback</title>
  <desc id="desc">A static plan fallback for package-only WebPage builds. Repository-source builds regenerate this view from the versioned stage JSON through Visualize and the GUI.SVG adapter. Footprints are illustrative.</desc>
  <defs>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#16404e" stroke-width="1"/></pattern>
  </defs>
  <rect width="1000" height="700" fill="#030a14"/>
  <rect width="1000" height="700" fill="url(#grid)"/>
