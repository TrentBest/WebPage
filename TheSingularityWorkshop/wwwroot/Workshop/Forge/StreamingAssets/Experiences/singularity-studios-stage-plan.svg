  <rect x="383" y="251" width="234" height="162" fill="#05adba" fill-opacity=".78" stroke="#8cf8ff" stroke-width="3"/>
  <path d="M383 305H617M383 359H617M461 251V413M539 251V413" stroke="#b7fbff" stroke-opacity=".55" stroke-width="2"/>
  <text x="500" y="332" fill="#03121a" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">MODULAR</text>
  <text x="500" y="352" fill="#03121a" font-family="monospace" font-size="15" font-weight="bold" text-anchor="middle">COURTYARD</text>
  <rect x="280" y="284" width="7" height="5" fill="#ffb848" stroke="#fff0ce"/>
  <rect x="712" y="374" width="7" height="5" fill="#ffb848" stroke="#fff0ce"/>
