<script src="_framework/blazor.webassembly.js" autostart="false"></script>

<script>
    // 2. The Custom Blazor Bootloader (Bypasses Azure's MIME Bug)
    Blazor.start({
        loadBootResource: function (type, name, defaultUri, integrity) {

            // FIX: Let Blazor handle dotnet.js natively using the default URI string
            if (type === 'dotnetjs') {
                return defaultUri;
            }

            // Intercept ONLY WebAssembly binaries to force the correct MIME type
            if (type === 'dotnetwasm' || defaultUri.endsWith('.wasm')) {
                return (async function () {
                    const response = await fetch(defaultUri, { cache: 'no-store' });
                    if (!response.ok) throw new Error("Failed to load: " + name);

                    const buffer = await response.arrayBuffer();
                    return new Response(buffer, { headers: { "content-type": "application/wasm" } });
                })();
            }
        }
    });

    // 3. The Sovereign Kernel Synapse
    window.interop = {
        // ... keep your exact initUnity code here ...
        initUnity: function (canvasId) {

                codeUrl: buildUrl + "/Build001.wasm",
                streamingAssetsUrl: "StreamingAssets",
                companyName: "The Singularity Workshop",
                productName: "Genesis",
                productVersion: "1.0",
            };

            var script = document.createElement("script");
            script.src = loaderUrl;
            script.onload = () => {
                createUnityInstance(canvas, config, (progress) => {
                    console.log("Kernel Ignition Progress: " + (100 * progress) + "%");
                }).then((unityInstance) => {
                    window.sovereignUnityInstance = unityInstance;
                    console.log("Sovereign Kernel successfully anchored to Blazor DOM.");
                }).catch((message) => {
                    alert("Engine Error: " + message);
                });
            };
            document.body.appendChild(script);
        }
    };
