<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Singularity Workshop</title>
    <base href="/" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TheSingularityWorkshop.styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/workshop-landing.css" />
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type === 'dotnetjs') {
                    return defaultUri;
                }

                if (type === 'dotnetwasm' || defaultUri.endsWith('.wasm')) {
                    return (async function () {
                        const response = await fetch(defaultUri, { cache: 'no-store' });
                        if (!response.ok) throw new Error("Failed to load: " + name);

                        const buffer = await response.arrayBuffer();
                        return new Response(buffer, { headers: { "content-type": "application/wasm" } });
                    })();
                }
            }
        });

        // Sovereign Kernel Synapse.
        // Unity initialization may be requested by Blazor before the canvas has
        // actually been rendered. Keep the request alive until the canvas exists.
        window.interop = {
            _unityInitializing: false,
            _unityInitialized: false,
            _canvasObserver: null,

            initUnity: function (canvasId) {
                console.log("[Interop] initUnity requested for canvas:", canvasId);

                if (window.interop._unityInitialized || window.interop._unityInitializing) {
                    console.log("[Interop] Unity bootstrap already active or complete.");
                    return;
                }

                const start = () => {
                    const canvas = document.getElementById(canvasId);
                    if (!canvas) {
                        console.log("[Interop] Canvas not rendered yet; waiting for Blazor render.");
                        return false;
                    }

                    if (window.interop._canvasObserver) {
                        window.interop._canvasObserver.disconnect();
                        window.interop._canvasObserver = null;
                    }

                    window.interop._unityInitializing = true;

                    const buildUrl = "Workshop/Forge/Build";
                    const loaderUrl = buildUrl + "/Build001.loader.js";

                    const config = {
                        dataUrl: buildUrl + "/Build001.data.br",
                        frameworkUrl: buildUrl + "/Build001.framework.js.br",
                        codeUrl: buildUrl + "/Build001.wasm.br",
                        streamingAssetsUrl: "StreamingAssets",
                        companyName: "The Singularity Workshop",
                        productName: "Genesis",
                        matchWebGLToCanvasSize: true,
                        devicePixelRatio: 1
                    };

                    console.log("[Interop] Loading Unity loader:", loaderUrl);

                    const existingLoader = document.querySelector('script[data-workshop-unity-loader="true"]');
                    const script = existingLoader || document.createElement("script");

                    const boot = () => {
                        if (typeof createUnityInstance !== "function") {
                            console.error("[Interop] Unity loader loaded but createUnityInstance is unavailable.");
                            window.interop._unityInitializing = false;
                            return;
                        }

                        console.log("[Interop] Firing createUnityInstance...");
                        createUnityInstance(canvas, config, (progress) => {
                            console.log("[Unity Engine] Boot Progress: " + (100 * progress).toFixed(1) + "%");
                        }).then((instance) => {
                            window.sovereignUnityInstance = instance;
                            window.interop._unityInitialized = true;
                            window.interop._unityInitializing = false;
                            console.log("[Interop] SUCCESS: Sovereign Kernel anchored to Blazor DOM.");
                        }).catch((message) => {
                            window.interop._unityInitializing = false;
                            console.error("[Unity Engine] CRITICAL BOOT FAILURE:", message);
                        });
                    };

                    if (existingLoader) {
                        boot();
                    } else {
                        script.src = loaderUrl;
                        script.dataset.workshopUnityLoader = "true";
                        script.onload = boot;
                        script.onerror = () => {
                            window.interop._unityInitializing = false;
                            console.error("[Interop] CRITICAL: Failed to download Unity loader: " + loaderUrl);
                        };
                        document.body.appendChild(script);
                    }

                    return true;
                };

                if (start()) {
                    return;
                }

                if (window.interop._canvasObserver) {
                    window.interop._canvasObserver.disconnect();
                }

                window.interop._canvasObserver = new MutationObserver(() => {
                    if (start()) {
                        window.interop._canvasObserver.disconnect();
                        window.interop._canvasObserver = null;
                    }
                });

                window.interop._canvasObserver.observe(document.body, {
                    childList: true,
                    subtree: true
                });

                requestAnimationFrame(() => start());
            }
        };
    </script>
</body>
</html>
