<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Singularity Workshop</title>
    <base href="/" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="TheSingularityWorkshop.styles.css" rel="stylesheet" />
</head>
<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        // The Workshop owns the landing surface until the first-contact sequence
        // presents the moniker and releases the application chrome.
        const workshopLanding = window.location.pathname === "/" || window.location.pathname === "";
        if (workshopLanding) {
            document.documentElement.classList.add("workshop-splash-locked");
        }
    </script>

    <script src="_framework/blazor.webassembly.js" autostart="false"></script>

    <script>
        // 2. The Custom Blazor Bootloader (Bypasses Azure's MIME Bug)
        Blazor.start({
            loadBootResource: function (type, name, defaultUri, integrity) {
                if (type === 'dotnetjs') {
                    return defaultUri;
                }

                if (type === 'dotnetwasm' || defaultUri.endsWith('.wasm')) {
                    return (async function () {
                        const response = await fetch(defaultUri, { cache: 'no-store' });
                        if (!response.ok) throw new Error("Failed to load: " + name);

                        const buffer = await response.arrayBuffer();
                        return new Response(buffer, { headers: { "content-type": "application/wasm" } });
                    })();
                }
            }
        });

        window.interop = {
            initUnity: function (canvasId) {
                console.log("[Interop] 1. initUnity called for canvas:", canvasId);

                const canvas = document.getElementById(canvasId);
                if (!canvas) {
                    console.error("[Interop] CRITICAL: Canvas element not found in the DOM!");
                    return;
                }

                const buildUrl = "Workshop/Forge/Build";
                const loaderUrl = buildUrl + "/Build001.loader.js";

                const config = {
                    dataUrl: buildUrl + "/Build001.data.br",
                    frameworkUrl: buildUrl + "/Build001.framework.js.br",
                    codeUrl: buildUrl + "/Build001.wasm.br",
                    streamingAssetsUrl: "StreamingAssets",
                    companyName: "The Singularity Workshop",
                    productName: "Genesis",
                };

                console.table(config);

                const script = document.createElement("script");
                script.src = loaderUrl;

                script.onerror = () => {
                    console.error("[Interop] CRITICAL: Failed to download loader.js! Check the Build folder path.");
                };

                script.onload = () => {
                    console.log("[Interop] 4. Loader script executed. Firing createUnityInstance...");

                    createUnityInstance(canvas, config, (progress) => {
                        console.log("[Unity Engine] Boot Progress: " + (100 * progress).toFixed(1) + "%");
                    }).then((instance) => {
                        window.sovereignUnityInstance = instance;
                        console.log("[Interop] 5. SUCCESS! Sovereign Kernel anchored to Blazor DOM.");
                    }).catch((message) => {
                        console.error("[Unity Engine] CRITICAL BOOT FAILURE:", message);
                    });
                };
                document.body.appendChild(script);
            }
        };

        // Transitional shell adapter. The visual sequence remains inside the
        // Workshop; this adapter only knows when the final gateway has appeared.
        // The eventual GUI builder will own this transition semantically.
        (function watchWorkshopRelease() {
            if (!workshopLanding) return;

            let released = false;
            let presentationStarted = false;

            function releaseWorkshop() {
                if (released) return;
                released = true;
                document.documentElement.classList.remove("workshop-splash-locked");
                document.documentElement.classList.add("workshop-splash-released");
            }

            function presentMoniker() {
                if (presentationStarted) return;
                presentationStarted = true;

                const overlay = document.createElement("div");
                overlay.className = "workshop-moniker-overlay";
                overlay.setAttribute("aria-label", "The Singularity Workshop");

                const moniker = document.createElement("div");
                moniker.className = "workshop-moniker";

                ["THE", "SINGULARITY", "WORKSHOP"].forEach((word) => {
                    const line = document.createElement("div");
                    line.className = "workshop-moniker-line";
                    [...word].forEach((letter) => {
                        const span = document.createElement("span");
                        span.textContent = letter;
                        line.appendChild(span);
                    });
                    moniker.appendChild(line);
                });

                overlay.appendChild(moniker);
                document.body.appendChild(overlay);

                window.setTimeout(() => {
                    releaseWorkshop();
                    overlay.remove();
                }, 3000);
            }

            function inspectWorkshop() {
                if (document.querySelector(".gateway-interface")) {
                    presentMoniker();
                }

                // Normalize the living GUI's legacy pixel coordinates against the
                // actual Workshop surface. This keeps the existing behavior while
                // making it independent of monitor resolution and browser scaling.
                const container = document.querySelector(".chaos-container");
                if (!container) return;

                const width = container.clientWidth;
                const height = container.clientHeight;
                if (!width || !height) return;

                container.querySelectorAll(".chaos-node").forEach((node) => {
                    const element = /** @type {HTMLElement} */ (node);
                    if (element.dataset.workshopNormalized === "true") return;

                    const matchX = element.style.left.match(/^(-?[0-9.]+)px$/);
                    const matchY = element.style.top.match(/^(-?[0-9.]+)px$/);
                    if (!matchX || !matchY) return;

                    let x = parseFloat(matchX[1]);
                    let y = parseFloat(matchY[1]);

                    if (element.querySelector(".node-gen")?.textContent?.trim() === "GEN 1") {
                        x = width * 0.5;
                        y = height * 0.5;
                    }

                    element.style.left = `${Math.max(2, Math.min(98, (x / width) * 100))}%`;
                    element.style.top = `${Math.max(3, Math.min(97, (y / height) * 100))}%`;
                    element.dataset.workshopNormalized = "true";
                });
            }

            const observer = new MutationObserver(inspectWorkshop);
            observer.observe(document.body, { childList: true, subtree: true });
            window.addEventListener("resize", () => {
                document.querySelectorAll(".chaos-node").forEach((node) => {
                    node.removeAttribute("data-workshop-normalized");
                });
                inspectWorkshop();
            });
        })();
    </script>
</body>
</html>
